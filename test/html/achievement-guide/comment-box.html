<!--
  Guide comment box (an achievement guide's add comment). Captured by the earlier tests (date unknown, before
  2026-10). Condensed 2026-11-01: just the reply box; its first toolbar group is cut to 2 of its 7 buttons, the site's
  smileydropdown to 2 of its 20 items, and inline handlers (onclick) are removed.
-->
<html>
  <body>
    <div class="adv_editbox frm-grp frm-a-top" id="aeb_txtAddSubComment">
      <label class="sr-only" for="txtAddSubComment">Leave a comment</label>
      <div>
        <div class="toolbar">
          <div class="formatbuttons">
            <span class="format_bold" tabindex="0" title="Insert pair of bold tags (Alt + B)">
              <i class="fa fa-bold"></i>
            </span>
            <span class="format_underline" tabindex="0" title="Insert pair of underline tags (Alt + U)">
              <i class="fa fa-underline"></i>
            </span>
          </div>
          <div class="formatbuttons">
            <div>
              <span tabindex="0" title="Insert emoticons">
                <i class="fa fa-smile-o"></i>
              </span>
              <div style="display: none" class="smileydropdown dropdownbuttonpanel">
                <span tabindex="0">
                  <img src="/images/smiley/smile.gif" alt="smile" width="15" height="15">
                </span>
                <span tabindex="0">
                  <img src="/images/smiley/laugh.gif" alt="laugh" width="15" height="15">
                </span>
              </div>
            </div>
          </div>
        </div>
        <div class="aeb_wrap">
          <textarea id="txtAddSubComment" name="txtAddSubComment" rows="3" class="textarea expandable" placeholder="Leave a comment..." style="height: 92px"></textarea>
        </div>
      </div>
    </div>
  </body>
</html>
