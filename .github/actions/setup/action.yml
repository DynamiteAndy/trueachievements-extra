name: Setup
description: pnpm, Node and the dependencies, with node_modules restored from the cache when the lockfile is unchanged

runs:
  using: composite
  steps:
  # The version comes from package.json (devEngines.packageManager, then packageManager; setting one here too fails
  # when they differ)
  - name: Install pnpm
    uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

  - name: Setup Node.js
    uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version-file: '.nvmrc'

  # The whole node_modules, not pnpm's store: a hit skips the install, so each job costs only the unpack
  - name: Restore node_modules
    id: node-modules
    uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: node_modules
      key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

  - name: Install dependencies
    if: steps.node-modules.outputs.cache-hit != 'true'
    shell: bash
    run: pnpm install --frozen-lockfile
